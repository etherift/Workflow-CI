name: MLflow CI - Retrain and Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
env:
  MLFLOW_TRACKING_URI: file:./mlruns
permissions:
  contents: write
jobs:
  train-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MLflow and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn==1.5.2 pandas==2.2.3 numpy==1.26.4
      - name: Run MLflow Project (retrain model)
        working-directory: MLProject
        run: |
          mlflow run . --env-manager=local --experiment-name breast_cancer_ci_retraining
      - name: Read run_id
        id: run_id
        working-directory: MLProject
        run: echo "run_id=$(cat run_id.txt)" >> "$GITHUB_OUTPUT"
      - name: Commit trained model artefact back to repository
        working-directory: MLProject
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -f mlruns/ run_id.txt
          git diff --staged --quiet || git commit -m "chore: update trained model artefact [skip ci]"
          git push
      - name: Upload model artefact (GitHub Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-${{ steps.run_id.outputs.run_id }}
          path: MLProject/mlruns/
      - name: Build Docker image with mlflow build-docker
        working-directory: MLProject
        run: |
          mlflow models build-docker \
            --model-uri "runs:/${{ steps.run_id.outputs.run_id }}/model" \
            --name "${{ secrets.DOCKERHUB_USERNAME }}/breast-cancer-model:latest" \
            --enable-mlserver
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Docker image to Docker Hub
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/breast-cancer-model:latest"
